{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Add New Trek</h2>
    <div class="card shadow-sm mt-3">
        <div class="card-body">
            <form action="{{ url_for('add_trek') }}" method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Trek Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Location</label>
                        <input type="text" name="location" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Difficulty</label>
                        <select name="difficulty" class="form-select" required>
                            <option value="Easy">Easy</option>
                            <option value="Moderate">Moderate</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Duration (Days)</label>
                        <input type="number" name="duration" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Available Slots</label>
                        <input type="number" name="slots" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Assign Staff (Optional)</label>
                        <select name="staff_id" class="form-select">
                            <option value="">-- No Staff Assigned --</option>
                            {% for staff in approved_staff %}
                                <option value="{{ staff.id }}" {% if trek and trek.staff_id == staff.id %}selected{% endif %}>
                                    {{ staff.full_name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select" required>
                            <option value="Open">Open</option>
                            <option value="Closed">Closed</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Save Trek</button>
                <a href="{{ url_for('manage_treks') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
