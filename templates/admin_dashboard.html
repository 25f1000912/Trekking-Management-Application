{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="mt-5">Admin Dashboard</h2>
    <div class="mb-3">
        <h4 class="mb-3">Quick Actions</h4>
        <a href="{{ url_for('manage_treks') }}" class="btn btn-primary btn-lg me-3 shadow-sm">
            <i class="bi bi-geo-alt"></i> 🏔️ Manage Treks
        </a>
        <a href="{{ url_for('manage_staff') }}" class="btn btn-secondary btn-lg shadow-sm">
            <i class="bi bi-people"></i> 👥 Manage Staff
        </a>
    </div>

    <!-- Bootstrap Grid Row for Cards -->
    <div class="row">
        <!-- Total Treks Card -->
        <div class="col-md-3 mb-4">
            <div class="card shadow-sm border rounded h-100">
                <div class="card-body d-flex justify-content-between align-items-center p-4">
                    <div>
                        <h6 class="text-muted fw-bold mb-3">Total Treks</h6>
                        <h2 class="fw-bolder mb-0 text-dark">{{ total_treks }}</h2>
                    </div>
                    <div class="bg-light rounded p-3 d-flex align-items-center justify-content-center">
                        <i class="bi bi-geo-alt fs-1 text-secondary"></i>
                    </div>
                </div>
            </div>
        </div>
    
        <!-- Total Users Card -->
        <div class="col-md-3 mb-4">
            <div class="card shadow-sm border rounded h-100">
                <div class="card-body d-flex justify-content-between align-items-center p-4">
                    <div>
                        <h6 class="text-muted fw-bold mb-3">Total Users</h6>
                        <h2 class="fw-bolder mb-0 text-dark">{{ total_users }}</h2>
                    </div>
                    <div class="bg-light rounded p-3 d-flex align-items-center justify-content-center">
                        <i class="bi bi-person fs-1 text-secondary"></i>
                    </div>
                </div>
            </div>
        </div>
    
        <!-- Total Staff Card -->
        <div class="col-md-3 mb-4">
            <div class="card shadow-sm border rounded h-100">
                <div class="card-body d-flex justify-content-between align-items-center p-4">
                    <div>
                        <h6 class="text-muted fw-bold mb-3">Total Staff</h6>
                        <h2 class="fw-bolder mb-0 text-dark">{{ total_staff }}</h2>
                    </div>
                    <div class="bg-light rounded p-3 d-flex align-items-center justify-content-center">
                        <i class="bi bi-people fs-1 text-secondary"></i>
                    </div>
                </div>
            </div>
        </div>
    
        <!-- Total Bookings Card -->
        <div class="col-md-3 mb-4">
            <div class="card shadow-sm border rounded h-100">
                <div class="card-body d-flex justify-content-between align-items-center p-4">
                    <div>
                        <h6 class="text-muted fw-bold mb-3">Total Bookings</h6>
                        <h2 class="fw-bolder mb-0 text-dark">{{ total_bookings }}</h2>
                    </div>
                    <div class="bg-light rounded p-3 d-flex align-items-center justify-content-center">
                        <i class="bi bi-calendar3 fs-1 text-secondary"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
